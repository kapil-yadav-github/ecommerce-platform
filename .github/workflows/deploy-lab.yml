name: Environment Lab

on:
  workflow_dispatch:

jobs:

  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Deploy to DEV
        env:
          LAB_SECRET: ${{ secrets.LAB_ENV_SECRET }}
        run: |
          echo "Deploying to DEV"
          echo "DEV secret length: ${#LAB_SECRET}"

  deploy-staging:
    name: Deploy to STAGING
    needs: deploy-dev
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Deploy to STAGING
        env:
          LAB_SECRET: ${{ secrets.LAB_ENV_SECRET }}
        run: |
          echo "Deploying to STAGING"
          echo "STAGING secret length: ${#LAB_SECRET}"

  deploy-production:
    name: Deploy to PRODUCTION
    needs: deploy-staging
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Deploy to PRODUCTION
        env:
          LAB_SECRET: ${{ secrets.LAB_ENV_SECRET }}
        run: |
          echo "Deploying to PRODUCTION"
          echo "PRODUCTION secret length: ${#LAB_SECRET}"
