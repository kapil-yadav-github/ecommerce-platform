
name: Build, Push and Deploy Order Service V1

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 397303792495.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: ecommerce/order-service
  EC2_INSTANCE_ID: i-013598012d6ecd27e

jobs:
  build-push-deploy:
    name: Build, Push and Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v7

      # Configure Java and Maven
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Build the Spring Boot JAR
      - name: Build application with Maven
        run: mvn clean package -DskipTests

      # Verify that the JAR was generated
      - name: Verify JAR file
        run: |
          echo "Generated JAR files:"
          ls -lh target/*.jar

      # 2. Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::397303792495:role/GitHubActions-Ecommerce
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Build Docker image locally
      - name: Build Docker image
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "Building image: $IMAGE"

          docker build \
            --pull \
            -t "$IMAGE" \
            .

      # 6. Scan Docker image before pushing
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 397303792495.dkr.ecr.us-east-1.amazonaws.com/ecommerce/order-service:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true

      # 7. Push Docker image to ECR
      - name: Push Docker image to ECR
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          docker push "$IMAGE"

          echo "Image pushed successfully: $IMAGE"

      # 8. Copy deploy.sh to EC2 using SSM
      - name: Copy deploy.sh to EC2 using SSM
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_PATH="deploy.sh"

          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "deploy.sh not found at $SCRIPT_PATH"
            exit 1
          fi

          SCRIPT_B64=$(base64 -w 0 "$SCRIPT_PATH")

          REMOTE_COMMAND=$(cat <<EOF
          set -e
          mkdir -p /opt/order-service
          echo '$SCRIPT_B64' | base64 -d | sudo tee /opt/order-service/deploy.sh >/dev/null
          sudo chown root:root /opt/order-service/deploy.sh
          sudo chmod 750 /opt/order-service/deploy.sh
          sudo chmod 755 /opt/order-service
          ls -l /opt/order-service/deploy.sh
          EOF
          )

          PARAMETERS=$(jq -n \
            --arg cmd "$REMOTE_COMMAND" \
            '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "Copy command ID: $COMMAND_ID"

          STATUS="Pending"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Copy attempt $i: $STATUS"

            case "$STATUS" in
              Success)
                echo "deploy.sh copied successfully."
                break
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --output json
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Copy operation timed out. Status: $STATUS"
            exit 1
          fi

      # 9. Deploy the exact image pushed to ECR
      - name: Deploy using SSM
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "Deploying image: $IMAGE"

          REMOTE_COMMAND="sudo /opt/order-service/deploy.sh $IMAGE"

          PARAMETERS=$(jq -n \
            --arg cmd "$REMOTE_COMMAND" \
            '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deploy attempt $i: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "SSM deployment failed."
                break
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          # Print remote execution details
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --output json || true

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed. Final status: $STATUS"
            exit 1
          fi

          echo "Deployment completed successfully."