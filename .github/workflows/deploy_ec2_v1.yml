name: Deploy Order Service V1 to EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 397303792495.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: ecommerce/order-service
  EC2_INSTANCE_ID: i-013598012d6ecd27e

jobs:
  deploy:
    name: Deploy V1 through SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::397303792495:role/GitHubActions-Ecommerce
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Copy deploy.sh to EC2 using SSM
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_PATH="order-service/deploy.sh"

          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "deploy.sh not found at $SCRIPT_PATH"
            exit 1
          fi

          # Encode the script on the GitHub runner
          SCRIPT_B64=$(base64 -w 0 "$SCRIPT_PATH")

          # Reconstruct the script on EC2 and set secure permissions
          REMOTE_COMMAND=$(cat <<EOF
          set -e
          mkdir -p /opt/order-service
          echo '$SCRIPT_B64' | base64 -d | sudo tee /opt/order-service/deploy.sh >/dev/null
          sudo chown root:root /opt/order-service/deploy.sh
          sudo chmod 750 /opt/order-service/deploy.sh
          sudo chmod 755 /opt/order-service
          ls -l /opt/order-service/deploy.sh
          EOF
          )

          PARAMETERS=$(jq -n \
            --arg cmd "$REMOTE_COMMAND" \
            '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "Copy command ID: $COMMAND_ID"

          # Wait for the copy and permission update to finish
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Copy status: $STATUS"

            case "$STATUS" in
              Success)
                echo "deploy.sh copied and permissions configured."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Copy operation timed out"
          exit 1

      - name: Deploy using SSM
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ GitHub.sha }}"

          echo "Deploying image: $IMAGE"

          REMOTE_COMMAND="sudo /opt/order-service/deploy.sh $IMAGE"

          PARAMETERS=$(jq -n \
            --arg cmd "$REMOTE_COMMAND" \
            '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Poll SSM and capture the actual remote status
          STATUS="Pending"

          for i in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i: SSM status = $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                break
                ;;

              Failed|Cancelled|TimedOut)
                echo "SSM deployment failed."
                break
                ;;

              *)
                sleep 10
                ;;
            esac
          done

          # Always print the remote command result
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --output json || true

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed or timed out. Final status: $STATUS"
            exit 1
          fi

          echo "Deployment completed successfully."